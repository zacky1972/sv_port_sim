name: Elixir CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test / Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.19.5"
            otp: "28.4.2"
            setup: "setup-beam"
            strict_warnings: "false"
            cache_key: "elixir-1.19.5-otp-28.4.2"
          - elixir: "1.20.0"
            otp: "29.0.1"
            setup: "manual-otp29-elixir120"
            strict_warnings: "true"
            cache_key: "elixir-1.20.0-otp-29.0.1"

    steps:
      - uses: actions/checkout@v6

      - name: Set up Elixir with setup-beam
        if: matrix.setup == 'setup-beam'
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1.24.0
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
          version-type: strict

      - name: Set up Elixir 1.20 / OTP 29
        if: matrix.setup == 'manual-otp29-elixir120'
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y unzip

          # Install OTP 29 with the official Elixir installer, then put an
          # Elixir 1.20.0 executable on PATH.  This keeps the CI check generic
          # to the Elixir 1.20 / OTP 29 toolchain while avoiding issue-specific
          # workflow jobs.
          curl -fsSO https://elixir-lang.org/install.sh
          sh install.sh elixir@${{ matrix.elixir }} otp@${{ matrix.otp }} --force

          installs_dir="$HOME/.elixir-install/installs"
          otp_bin="$({ find "$installs_dir/otp" -type f -path '*/bin/erl' -printf '%h\n' || true; } | sort -V | tail -n 1)"
          elixir_bin="$({ find "$installs_dir/elixir" -type f -path '*/bin/elixir' -printf '%h\n' || true; } | sort -V | tail -n 1)"

          if [ -z "$otp_bin" ]; then
            echo "Failed to find an OTP 29 erl executable under $installs_dir/otp" >&2
            exit 1
          fi

          if [ -z "$elixir_bin" ]; then
            echo "Failed to find an Elixir 1.20 executable under $installs_dir/elixir" >&2
            exit 1
          fi

          echo "$otp_bin" >> "$GITHUB_PATH"
          echo "$elixir_bin" >> "$GITHUB_PATH"

      - name: Print BEAM versions
        run: |
          which erl
          which elixir
          elixir -v

      - name: Assert Elixir 1.20 / OTP 29 toolchain
        if: matrix.setup == 'manual-otp29-elixir120'
        shell: bash
        run: |
          set -euo pipefail
          version_output="$(elixir -v)"
          echo "$version_output"
          grep -F "Erlang/OTP 29" <<< "$version_output"
          grep -F "Elixir 1.20.0" <<< "$version_output"

      - name: Install Hex and Rebar
        if: matrix.setup == 'manual-otp29-elixir120'
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Restore dependencies cache
        uses: actions/cache@v5
        with:
          path: deps
          key: ${{ runner.os }}-${{ matrix.cache_key }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.cache_key }}-mix-
            ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Check
        if: matrix.strict_warnings == 'false'
        run: mix check

      - name: Compile with warnings as errors
        if: matrix.strict_warnings == 'true'
        run: mix compile --warnings-as-errors --force

      - name: Precompile test dependencies
        if: matrix.strict_warnings == 'true'
        run: MIX_ENV=test mix deps.compile

      - name: Run tests
        if: matrix.strict_warnings == 'false'
        run: mix test

      - name: Verify Docker for real Verilator workflow
        if: matrix.strict_warnings == 'true'
        run: docker version

      - name: Run tests with warnings as errors and real Verilator
        if: matrix.strict_warnings == 'true'
        env:
          SV_PORT_SIM_RUN_VERILATOR_TESTS: "1"
          SV_PORT_SIM_VERILATOR_IMAGE: "verilator/verilator:latest"
        run: mix test --warnings-as-errors
